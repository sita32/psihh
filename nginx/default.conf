# nginx «Рядом»: статичные страницы из frontend/ и прокси /api на сервер Node.js
server {
    listen 80;
    server_name _;
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    # Браузер каждый раз сверяет файл с сервером (по ETag, без повторной загрузки, если не менялся):
    # правки в frontend/ видны сразу после обновления страницы, как с tools/dev-server.py
    add_header Cache-Control "no-cache" always;

    # Сжатие текста (CSS, JS, SVG, JSON); HTML сжимается всегда
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API: адрес передаётся как есть (/api/health → http://api:3000/api/health).
    # Ошибки API (в том числе 404) – JSON от сервера, error_page на них не действует.
    location /api/ {
        # Адрес контейнера api ищется через DNS Docker при каждом запросе (не раз при старте nginx):
        # после перезапуска api у него может быть другой IP
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api http://api:3000;
        proxy_pass $api;
        proxy_connect_timeout 5s;   # сервер выключен – сразу 502, а не минута ожидания
        # Сканы дипломов – до 20 МБ (по умолчанию nginx пускает только 1 МБ); точный лимит проверяет сервер
        client_max_body_size 21m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Чат: Socket.IO – WebSocket (заголовки Upgrade) и запасной вариант через долгие HTTP-запросы
    location /socket.io/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api http://api:3000;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;   # соединение живёт долго; Socket.IO сам шлёт ping каждые 25 с
    }

    # Фото профилей – публичные. Документы и файлы из чата отдаёт только API, после проверки прав
    location /uploads/avatars/ {
        alias /srv/uploads/avatars/;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Своя страница 404 для любого несуществующего адреса
    error_page 404 /404.html;

    # В 404.html пути относительные (страница открывается и как файл).
    # На вложенном адресе (/a/b/c) они бы не нашлись, поэтому делаем их от корня сайта –
    # то же, что tools/dev-server.py. Новая ссылка в 404.html – новая строка здесь.
    location = /404.html {
        sub_filter_once off;
        sub_filter 'href="css/'          'href="/css/';
        sub_filter 'href="assets/'       'href="/assets/';
        sub_filter 'src="assets/'        'src="/assets/';
        sub_filter 'href="favicon.ico"'  'href="/favicon.ico"';
        sub_filter 'href="index.html"'   'href="/index.html"';
        sub_filter 'href="quiz.html"'    'href="/quiz.html"';
    }
}
