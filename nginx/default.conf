# nginx «Рядом»: статичные страницы из frontend/ и прокси /api на сервер Node.js
server {
    listen 80;
    server_name _;
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    # Сжатие текста (CSS, JS, SVG, JSON); HTML сжимается всегда
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API: адрес передаётся как есть (/api/health → http://api:3000/api/health).
    # Ошибки API (в том числе 404) – JSON от сервера, error_page на них не действует.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Своя страница 404 для любого несуществующего адреса
    error_page 404 /404.html;

    # В 404.html пути относительные (страница открывается и как файл).
    # На вложенном адресе (/a/b/c) они бы не нашлись, поэтому делаем их от корня сайта –
    # то же, что tools/dev-server.py. Новая ссылка в 404.html – новая строка здесь.
    location = /404.html {
        sub_filter_once off;
        sub_filter 'href="css/'          'href="/css/';
        sub_filter 'href="assets/'       'href="/assets/';
        sub_filter 'src="assets/'        'src="/assets/';
        sub_filter 'href="favicon.ico"'  'href="/favicon.ico"';
        sub_filter 'href="index.html"'   'href="/index.html"';
        sub_filter 'href="quiz.html"'    'href="/quiz.html"';
    }
}
