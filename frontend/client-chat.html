<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Иконка сайта: знак «Рядом» (вкладка браузера, закладки, экран телефона) -->

  <link rel="icon" href="assets/favicon/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
  <link rel="manifest" href="assets/favicon/site.webmanifest">
  <meta name="theme-color" content="#4AA597">
  <title>Чат – Рядом</title>
  <!-- Личный кабинет закрыт логином – поисковикам здесь делать нечего -->
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">

<body class="cab-page">
<!-- Для клавиатуры и экранных читалок: появляется по первому Tab, ведёт сразу к содержимому -->
<a href="#main" class="skip-link">Перейти к&nbsp;содержанию</a>

<!-- Иконки кабинета -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>

    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v5.5c0 4.4-3 8.1-7 9.5-4-1.4-7-5.1-7-9.5V6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M8.5 12l2.5 2.5 4.5-4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3.5 10h17M8 3v4M16 3v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-4.5 3.5V17h0A2.5 2.5 0 0 1 4 14.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-cap" viewBox="0 0 24 24"><path d="M2.5 9.5L12 5l9.5 4.5L12 14z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M6.5 11.5V16c0 1.5 2.5 3 5.5 3s5.5-1.5 5.5-3v-4.5M21.5 9.5V15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4.5 20c.8-3.6 3.7-5.5 7.5-5.5s6.7 1.9 7.5 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 7l8 6 8-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.3 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M2.5 19.5c.6-3.3 3.2-5 6.5-5s5.9 1.7 6.5 5M16 5.2a3.5 3.5 0 0 1 0 6.6M18 14.8c1.9.6 3.1 2.2 3.5 4.7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 10a6 6 0 0 1 12 0c0 5 2 6.5 2 6.5H4S6 15 6 10zM10 19.5a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4M15 16l4-4-4-4M19 12H9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.8l1.4-2h4.6l1.4 2h1.8A2.5 2.5 0 0 1 20 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>

    <symbol id="i-read" viewBox="0 0 24 24"><path d="M2.5 12.5l4 4L15 8M10 15.5l1 1L19.5 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  </defs>
</svg>

<!-- =========================== ШАПКА КАБИНЕТА =========================== -->
<header class="cab-top">
  <div class="cab-top__inner">
    <a href="index.html" class="logo" aria-label="Рядом – на главную">
      <span class="logo__mark" aria-hidden="true"><i></i><i></i></span>
      <span class="logo__text">рядом</span>
    </a>
    <div class="cab-top__right">
      <button class="icon-btn" type="button" aria-label="Уведомления"><svg><use href="#i-bell"/></svg><span class="dot"></span></button>
      <a href="#" class="me" aria-label="Мой профиль">
        <span class="ava-sq" style="--s:40px"><img src="assets/img/avatars/a03.webp" alt=""></span>
        <span class="me__text"><span class="me__name" data-bind="me-name">Анна</span><span class="me__role">Клиент</span></span>
      </a>
    </div>
  </div>
</header>

<div class="cab cab--chat">
    <!-- Боковое меню кабинета -->
    <nav class="cab-nav" aria-label="Разделы кабинета">
      <a href="cabinet-client.html"><svg><use href="#i-user"/></svg>Профиль</a>
      <a href="client-sessions.html"><svg><use href="#i-calendar"/></svg>Мои сессии</a>
      <a href="client-chat.html" class="is-active" aria-current="page"><svg><use href="#i-chat"/></svg>Чат</a>
      <a href="client-reviews.html"><svg><use href="#i-star"/></svg>Отзывы</a>
      <hr>
      <a href="index.html" class="logout"><svg><use href="#i-logout"/></svg>Выйти</a>
    </nav>

  <!-- =========================== ЧАТ =========================== -->
  <main id="main" tabindex="-1" class="cab-main">
    <div class="chat" data-chat>

      <!-- Список диалогов (заполняется из chat.js) -->
      <section class="dialogs" aria-label="Диалоги">
        <div class="dialogs__head">
          <h1>Сообщения</h1>
          <label class="search">
            <svg><use href="#i-search"/></svg>
            <input type="search" placeholder="Поиск по&nbsp;имени" aria-label="Поиск диалога" data-search>
          </label>
        </div>
        <div class="dialogs__list" data-dialogs></div>
      </section>

      <!-- Открытый диалог -->
      <section class="conv" aria-label="Переписка">
        <header class="conv__head">
          <button class="icon-btn conv__back" type="button" aria-label="Назад к&nbsp;диалогам" data-back><svg><use href="#i-back"/></svg></button>
          <span class="ava-sq" data-conv-ava></span>
          <div class="conv__who"><b data-conv-name></b><small data-conv-status></small></div>
          <div class="conv__actions">
            <span class="next-session" data-conv-session hidden><svg><use href="#i-calendar"/></svg><span></span></span>
            <a href="#" class="btn btn--line btn--sm" data-conv-profile>Профиль</a>
          </div>
        </header>

        <div class="messages" data-messages aria-live="polite"></div>

        <form class="composer" data-composer>
          <label class="icon-btn composer__attach" aria-label="Прикрепить файл" title="Прикрепить файл">
            <svg><use href="#i-clip"/></svg>
            <input type="file" data-attach>
          </label>
          <textarea rows="1" placeholder="Сообщение…" aria-label="Текст сообщения" data-input></textarea>
          <button class="send" type="submit" aria-label="Отправить" disabled><svg><use href="#i-send"/></svg></button>
        </form>
      </section>
    </div>
  </main>
</div>

<script src="js/chat.js"></script>
</body>
</html>
