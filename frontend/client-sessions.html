<!-- =========================== ШАПКА КАБИНЕТА =========================== -->
<header class="cab-top">
  <div class="cab-top__inner">
    <a href="index.html" class="logo" aria-label="Рядом – на главную">
      <span class="logo__mark" aria-hidden="true"><i></i><i></i></span>
      <span class="logo__text">рядом</span>
    </a>
    <div class="cab-top__right">
      <button class="icon-btn" type="button" aria-label="Уведомления"><svg><use href="#i-bell"/></svg><span class="dot"></span></button>
      <a href="cabinet-client.html" class="me" aria-label="Мой профиль">
        <span class="ava-sq" style="--s:40px"><img src="assets/img/avatars/a03.webp" alt=""></span>
        <span class="me__text"><span class="me__name">Анна</span><span class="me__role">Клиент</span></span>
      </a>
    </div>
  </div>
</header>

<div class="cab">
    <!-- Боковое меню кабинета -->
    <nav class="cab-nav" aria-label="Разделы кабинета">
      <a href="cabinet-client.html"><svg><use href="#i-user"/></svg>Профиль</a>
      <a href="client-sessions.html" class="is-active" aria-current="page"><svg><use href="#i-calendar"/></svg>Мои сессии</a>
      <a href="client-chat.html"><svg><use href="#i-chat"/></svg>Чат<span class="badge">2</span></a>
      <a href="client-reviews.html"><svg><use href="#i-star"/></svg>Отзывы</a>
      <hr>
      <a href="index.html" class="logout"><svg><use href="#i-logout"/></svg>Выйти</a>
    </nav>

  <!-- =========================== МОИ СЕССИИ =========================== -->
  <main id="main" tabindex="-1" class="cab-main">
    <div class="cab-head">
      <div>
        <h1>Мои сессии</h1>
      </div>
      <a href="catalog.html" class="btn btn--primary"><svg><use href="#i-plus"/></svg>Записаться</a>
    </div>

    <!-- Ближайшая сессия (заполняет sessions.js) -->
    <section class="next" data-next aria-label="Ближайшая сессия"></section>

    <!-- Вкладки -->
    <div class="tabs-line" role="tablist" data-tabs>
      <button type="button" role="tab" class="is-active" aria-selected="true" data-tab="upcoming">Предстоящие<small data-count="upcoming"></small></button>
      <button type="button" role="tab" aria-selected="false" data-tab="past">Прошедшие<small data-count="past"></small></button>
      <button type="button" role="tab" aria-selected="false" data-tab="cancelled">Отменённые<small data-count="cancelled"></small></button>
    </div>

    <!-- Список сессий выбранной вкладки -->
    <div class="sess-list" data-list aria-live="polite"></div>
  </main>
</div>

<!-- =========================== ДИАЛОГ: ПЕРЕНОС СЕССИИ =========================== -->
<dialog class="modal" id="move-modal" aria-labelledby="move-title">
  <form method="dialog" novalidate>
    <div class="modal__head">
      <h3 id="move-title">Перенести сессию</h3>
      <button class="icon-btn" value="cancel" formnovalidate aria-label="Закрыть"><svg><use href="#i-x"/></svg></button>
    </div>
    <div class="modal__body">
      <p class="modal__text" data-move-text></p>
      <span class="f__label">Новое время</span>
      <div class="pick-days" data-move-days></div>
      <div class="pick-times" data-move-times></div>
      <div class="presets" data-move-presets></div>
      <label class="f">
        <span class="f__label">Причина переноса <span class="f__req">*</span></span>
        <textarea class="f__area" rows="2" maxlength="300" placeholder="Например: рабочее совещание" data-move-reason></textarea>
        <span class="f__error">Укажите причину – её увидит другая сторона</span>
      </label>
    </div>
    <div class="modal__foot">
      <button class="btn btn--line" value="cancel" formnovalidate>Отмена</button>
      <button class="btn btn--primary" type="button" data-move-ok disabled>Перенести</button>
    </div>
  </form>
</dialog>

<!-- =========================== ДИАЛОГ: ОТЗЫВ О ПСИХОЛОГЕ =========================== -->
<dialog class="modal" id="review-modal" aria-labelledby="review-title">
  <form method="dialog" novalidate>
    <div class="modal__head">
      <h3 id="review-title" data-review-title>Отзыв о сессии</h3>
      <button class="icon-btn" value="cancel" formnovalidate aria-label="Закрыть"><svg><use href="#i-x"/></svg></button>
    </div>
    <div class="modal__body">
      <p class="modal__text" data-review-who></p>
      <!-- Звёзды идут в обратном порядке: так CSS подсвечивает все звёзды левее выбранной -->
      <div class="rate" role="radiogroup" aria-label="Оценка">
        <input type="radio" name="rating" id="r5" value="5"><label for="r5" title="Отлично"><svg><use href="#i-star"/></svg></label>
        <input type="radio" name="rating" id="r4" value="4"><label for="r4" title="Хорошо"><svg><use href="#i-star"/></svg></label>
        <input type="radio" name="rating" id="r3" value="3"><label for="r3" title="Нормально"><svg><use href="#i-star"/></svg></label>
        <input type="radio" name="rating" id="r2" value="2"><label for="r2" title="Плохо"><svg><use href="#i-star"/></svg></label>
        <input type="radio" name="rating" id="r1" value="1"><label for="r1" title="Очень плохо"><svg><use href="#i-star"/></svg></label>
      </div>
      <p class="rate-cap" data-rate-cap>Поставьте оценку</p>
      <label class="f">
        <span class="f__label">Расскажите о&nbsp;работе с&nbsp;психологом <small data-review-count>0 / 1000</small></span>
        <textarea class="f__area" rows="4" maxlength="1000" placeholder="Что было полезно, что изменилось после встреч"></textarea>
        <span class="f__error">Напишите хотя бы пару предложений – от&nbsp;30 символов</span>
      </label>
      <label class="toggle" style="margin-top:14px">
        <span><b>Опубликовать анонимно</b><small>вместо имени будет «Аноним»</small></span>
        <input type="checkbox" name="anon"><span class="toggle__sw"></span>
      </label>
      <p class="f__note">Перед публикацией отзыв проверит модератор – обычно в&nbsp;течение суток.</p>
    </div>
    <div class="modal__foot">
      <button class="btn btn--line" value="cancel" formnovalidate>Отмена</button>
      <button class="btn btn--primary" type="button" data-review-ok>Отправить</button>
    </div>
  </form>
</dialog>

<!-- =========================== ДИАЛОГ: ПРИЧИНА (отмена, перенос, блокировка, отклонение) =========================== -->
<dialog class="modal" id="reason-modal" aria-labelledby="reason-title">
  <form method="dialog" novalidate>
    <div class="modal__head">
      <h3 id="reason-title" data-reason-title>Укажите причину</h3>
      <button class="icon-btn" value="cancel" formnovalidate aria-label="Закрыть"><svg><use href="#i-x"/></svg></button>
    </div>
    <div class="modal__body">
      <div class="modal__text" data-reason-text></div>
      <div class="presets" data-reason-presets></div>
      <label class="f">
        <span class="f__label">Причина <span class="f__req">*</span></span>
        <textarea class="f__area" rows="3" maxlength="300" placeholder="Коротко опишите причину – её увидит другая сторона"></textarea>
        <span class="f__error">Укажите причину – хотя бы пару слов</span>
      </label>
    </div>
    <div class="modal__foot">
      <button class="btn btn--line" value="cancel" formnovalidate>Отмена</button>
      <button class="btn btn--primary" type="button" data-reason-ok>Подтвердить</button>
    </div>
  </form>
</dialog>

<!-- =========================== ДИАЛОГ: ПОДТВЕРЖДЕНИЕ =========================== -->
<dialog class="modal modal--small" id="confirm-modal" aria-labelledby="confirm-title">
  <form method="dialog">
    <div class="modal__head"><h3 id="confirm-title" data-confirm-title></h3></div>
    <div class="modal__body"><p data-confirm-text></p></div>
    <div class="modal__foot">
      <button class="btn btn--line" value="cancel">Отмена</button>
      <button class="btn btn--primary" value="ok" data-confirm-ok>Да</button>
    </div>
  </form>
</dialog>

<!-- Всплывающее уведомление -->
<div class="toast" role="status" aria-live="polite"><svg><use href="#i-check"/></svg><span></span></div>

<script src="js/api.js"></script>
<script src="js/session.js"></script>
<script src="js/ui.js"></script>
<script src="js/sessions.js"></script>
</body>
</html>
