# «Рядом»: сайт, сервер API, PostgreSQL и Redis.
# Запуск: cp .env.example .env && docker compose up --build  →  http://localhost
name: ryadom

services:
  # Отдаёт страницы из frontend/ и проксирует /api на сервер
  nginx:
    image: nginx:1.28-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro   # правки интерфейса видны без пересборки
      - ./nginx:/etc/nginx/conf.d:ro   # папка целиком: правки default.conf видны после nginx -s reload
      - uploads:/srv/uploads:ro          # отсюда nginx отдаёт фото профилей
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Сервер на Node.js (backend/Dockerfile); наружу не открыт, только через nginx
  api:
    build: ./backend
    environment:
      NODE_ENV: production
      API_PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ryadom}
      POSTGRES_USER: ${POSTGRES_USER:-ryadom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?задайте REDIS_PASSWORD в .env}
      JWT_SECRET: ${JWT_SECRET:?задайте JWT_SECRET в .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads   # документы психологов, фото профилей, файлы из чата
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s
    restart: unless-stopped

  # Тесты сервера (Jest + supertest): docker compose --profile test run --rm tests
  # Своя база ryadom_test (создаётся заново при каждом запуске) и своя база Redis (1) –
  # данные сайта не трогаются. src и tests подключены папками: правки видны без пересборки.
  tests:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    environment:
      NODE_ENV: test
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ryadom_test
      POSTGRES_USER: ${POSTGRES_USER:-ryadom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?задайте REDIS_PASSWORD в .env}
      REDIS_DB: 1
      JWT_SECRET: test-secret
      BCRYPT_ROUNDS: 4          # быстрый хеш паролей для новых тестовых аккаунтов
      UPLOAD_DIR: /tmp/uploads
      SQL_DIR: /database        # schema.sql, seed.sql, demo.sql для тестовой базы
    volumes:
      - ./database:/database:ro
      - ./backend/src:/app/src:ro
      - ./backend/tests:/app/tests:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # PostgreSQL 16: при первом старте (пустой volume) выполняет schema.sql, seed.sql и demo.sql
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ryadom}
      POSTGRES_USER: ${POSTGRES_USER:-ryadom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./database/demo.sql:/docker-entrypoint-initdb.d/03-demo.sql:ro   # демо-аккаунты
    healthcheck:
      # -h 127.0.0.1: пока идёт начальная загрузка схемы, БД слушает только сокет – не считаем её готовой
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
    restart: unless-stopped

  # Redis: сессии, кэш и временные данные (database/redis.md); наружу не открыт
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?задайте REDIS_PASSWORD в .env}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
      start_interval: 1s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  uploads:
